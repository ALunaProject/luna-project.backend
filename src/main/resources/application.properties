spring.application.name=luna-project.backend
spring.datasource.url=jdbc:mysql://localhost:3306/luna_db
spring.datasource.username=root
spring.datasource.password=root

# Configuracoes do JPA/Hibernate
# O schema agora e controlado pelo Flyway (src/main/resources/db/migration),
# entao o Hibernate nao cria/altera mais tabelas sozinho.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Flyway
spring.flyway.enabled=true
# Caso o banco ja tenha tabelas criadas antes pelo ddl-auto=update,
# evita que o Flyway falhe achando que o schema nao esta limpo.
spring.flyway.baseline-on-migrate=true

# Cloudinary API variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
