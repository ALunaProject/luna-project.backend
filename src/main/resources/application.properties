spring.application.name=luna-project.backend

# Supabase (Session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA/Hibernate
# O Hibernate cuida do schema sozinho (cria/atualiza as tabelas a partir
# das entidades @Entity), sem depender das migrations do Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Flyway desligado: quem cria/atualiza as tabelas agora e o Hibernate (ddl-auto acima).
spring.flyway.enabled=false

# Cloudinary API variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Admin inicial (criado no start se ainda não existir nenhum ADMIN)
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
