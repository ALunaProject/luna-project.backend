spring.application.name=luna-project.backend
spring.datasource.url=jdbc:mysql://localhost:3306/luna_db
spring.datasource.username=root
spring.datasource.password=root

# Configuracoes do JPA/Hibernate
# O Hibernate cuida do schema sozinho (cria/atualiza as tabelas a partir
# das entidades @Entity), sem depender das migrations do Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Flyway desligado: quem cria/atualiza as tabelas agora e o Hibernate (ddl-auto acima).
spring.flyway.enabled=false

# Cloudinary API variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
git add src/main/resources/application.properties
git commit -m "chore(config): let Hibernate manage the schema instead of Flyway"